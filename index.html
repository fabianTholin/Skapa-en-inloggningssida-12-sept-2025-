<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src = "script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="start">
        <h1>Välkommen att testa min inloggningssida!</h1>
        Användarnamn:<input id="användarnamnInput" type="text">
        <br>
        Lösenord:
        <input id="lösenordInput" type="text">
        <br>
        <input id="knapp" type="button" value="Logga in" onclick="testaLoggaIn()">
    </div>

    <div hidden id="inloggad">
        <h1>Välkommen in i värmen!</h1>
        <input type="button" value="Logga ut" onclick="loggaUt()">
    </div>
    
    <div hidden id="fel">
        <h1>FEL ANVÄNDARNAMN OCH/ELLER LÖSENORD!</h1>
    </div>
</body>
</html>
